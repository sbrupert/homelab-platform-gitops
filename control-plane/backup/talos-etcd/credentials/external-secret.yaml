apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: talos-etcd-garage-credentials
  namespace: kube-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-control-plane
  target:
    name: talos-etcd-garage-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: talos-etcd-s3-bucket-key-control-plane
        property: username
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: talos-etcd-s3-bucket-key-control-plane
        property: password
    - secretKey: AGE_RECIPIENT_PUBLIC_KEY
      remoteRef:
        key: talos-etcd-s3-bucket-age-key-control-plane
        property: username
