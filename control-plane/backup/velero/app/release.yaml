apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: velero
  namespace: velero
spec:
  interval: 30m
  timeout: 15m
  releaseName: velero
  targetNamespace: velero
  chart:
    spec:
      chart: velero
      version: 12.2.0
      sourceRef:
        kind: HelmRepository
        name: velero
        namespace: velero
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    initContainers:
      - name: velero-plugin-for-aws
        image: velero/velero-plugin-for-aws:v1.14.4
        imagePullPolicy: IfNotPresent
        volumeMounts:
          - name: plugins
            mountPath: /target
    credentials:
      useSecret: true
      existingSecret: velero-garage-credentials
    backupsEnabled: true
    snapshotsEnabled: false
    deployNodeAgent: false
    configuration:
      restoreOnlyMode: false
      defaultVolumesToFsBackup: false
      backupStorageLocation:
        - name: default
          provider: aws
          bucket: velero-control-plane
          accessMode: ReadWrite
          credential:
            name: velero-garage-credentials
            key: cloud
          config:
            region: hl1
            s3Url: https://s3.san.int.sbrtech.xyz
            publicUrl: https://s3.infra.int.sbrtech.xyz
            s3ForcePathStyle: "true"
    schedules:
      cluster-resources:
        schedule: "0 3 * * *"
        template:
          ttl: 720h
          storageLocation: default
          includeClusterResources: true
          snapshotVolumes: false
          defaultVolumesToFsBackup: false
