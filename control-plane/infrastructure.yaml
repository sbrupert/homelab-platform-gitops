apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-gateway-api-crds
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./control-plane/infrastructure/controllers
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-gateway-api-crds
  namespace: flux-system
spec:
  interval: 1h
  retryInterval: 1m
  timeout: 10m
  path: ./control-plane/infrastructure/crds/gateway-api
  # Never prune CRDs: deleting one also deletes every custom resource of that kind.
  prune: false
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-capi-operator
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./control-plane/infrastructure/capi/operator
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-capi-providers
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-capi-operator
    - name: infrastructure-kamaji
  interval: 5m
  retryInterval: 1m
  timeout: 20m
  path: ./control-plane/infrastructure/capi/providers
  prune: true
  # Explicit health checks cover resources installed indirectly by the operator.
  # Flux ignores spec.healthChecks when wait is true.
  wait: false
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: operator.cluster.x-k8s.io/v1alpha2
      kind: CoreProvider
      name: cluster-api
      namespace: capi-system
    - apiVersion: operator.cluster.x-k8s.io/v1alpha2
      kind: BootstrapProvider
      name: kubeadm
      namespace: capi-kubeadm-bootstrap-system
    - apiVersion: operator.cluster.x-k8s.io/v1alpha2
      kind: ControlPlaneProvider
      name: kubeadm
      namespace: capi-kubeadm-control-plane-system
    - apiVersion: operator.cluster.x-k8s.io/v1alpha2
      kind: ControlPlaneProvider
      name: kamaji
      namespace: kamaji-system
    - apiVersion: operator.cluster.x-k8s.io/v1alpha2
      kind: InfrastructureProvider
      name: proxmox
      namespace: capmox-system
    - apiVersion: operator.cluster.x-k8s.io/v1alpha2
      kind: IPAMProvider
      name: in-cluster
      namespace: capi-ipam-in-cluster-system
    - apiVersion: operator.cluster.x-k8s.io/v1alpha2
      kind: AddonProvider
      name: helm
      namespace: caaph-system
    - apiVersion: apps/v1
      kind: Deployment
      name: capi-controller-manager
      namespace: capi-system
    - apiVersion: apps/v1
      kind: Deployment
      name: capi-kubeadm-bootstrap-controller-manager
      namespace: capi-kubeadm-bootstrap-system
    - apiVersion: apps/v1
      kind: Deployment
      name: capi-kubeadm-control-plane-controller-manager
      namespace: capi-kubeadm-control-plane-system
    - apiVersion: apps/v1
      kind: Deployment
      name: capi-kamaji-controller-manager
      namespace: kamaji-system
    - apiVersion: apps/v1
      kind: Deployment
      name: capmox-controller-manager
      namespace: capmox-system
    - apiVersion: apps/v1
      kind: Deployment
      name: capi-ipam-in-cluster-controller-manager
      namespace: capi-ipam-in-cluster-system
    - apiVersion: apps/v1
      kind: Deployment
      name: caaph-controller-manager
      namespace: caaph-system
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: clusterclasses.cluster.x-k8s.io
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: proxmoxclustertemplates.infrastructure.cluster.x-k8s.io
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: proxmoxmachinetemplates.infrastructure.cluster.x-k8s.io
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: kamajicontrolplanetemplates.controlplane.cluster.x-k8s.io
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: kubeadmconfigtemplates.bootstrap.cluster.x-k8s.io
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      name: helmchartproxies.addons.cluster.x-k8s.io
  healthCheckExprs:
    - apiVersion: operator.cluster.x-k8s.io/v1alpha2
      current: >-
        !has(metadata.deletionTimestamp) &&
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.installedVersion) &&
        status.installedVersion == spec.version &&
        has(status.conditions) &&
        status.conditions.exists(c,
          c.type == 'PreflightCheckPassed' && c.status == 'True'
        ) &&
        status.conditions.exists(c,
          c.type in ['ProviderInstalled', 'ProviderUpgraded'] && c.status == 'True'
        )
    - apiVersion: apps/v1
      kind: Deployment
      current: >-
        !has(metadata.deletionTimestamp) &&
        has(spec.replicas) && spec.replicas > 0 &&
        has(status.observedGeneration) &&
        status.observedGeneration == metadata.generation &&
        has(status.updatedReplicas) && status.updatedReplicas == spec.replicas &&
        has(status.replicas) && status.replicas == spec.replicas &&
        has(status.availableReplicas) && status.availableReplicas == spec.replicas &&
        has(status.readyReplicas) && status.readyReplicas == spec.replicas &&
        (!has(status.unavailableReplicas) || status.unavailableReplicas == 0) &&
        has(status.conditions) &&
        status.conditions.exists(c, c.type == 'Available' && c.status == 'True')
    - apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      current: >-
        !has(metadata.deletionTimestamp) &&
        has(status.conditions) &&
        status.conditions.exists(c, c.type == 'Established' && c.status == 'True') &&
        status.conditions.exists(c, c.type == 'NamesAccepted' && c.status == 'True') &&
        spec.versions.exists(v,
          v.name == {"clusterclasses.cluster.x-k8s.io":"v1beta2","proxmoxclustertemplates.infrastructure.cluster.x-k8s.io":"v1alpha2","proxmoxmachinetemplates.infrastructure.cluster.x-k8s.io":"v1alpha2","kamajicontrolplanetemplates.controlplane.cluster.x-k8s.io":"v1alpha2","kubeadmconfigtemplates.bootstrap.cluster.x-k8s.io":"v1beta2","helmchartproxies.addons.cluster.x-k8s.io":"v1alpha1"}[metadata.name] && v.served
        )
---
