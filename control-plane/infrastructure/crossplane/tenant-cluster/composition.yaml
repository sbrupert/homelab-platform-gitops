apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: tenant-cluster-kamaji-proxmox-v1
spec:
  compositeTypeRef:
    apiVersion: platform.sbrtech.xyz/v1alpha1
    kind: TenantCluster
  mode: Pipeline
  pipeline:
    - step: render-capi-cluster
      functionRef:
        name: function-go-templating
      input:
        apiVersion: gotemplating.fn.crossplane.io/v1beta1
        kind: GoTemplate
        source: Inline
        options:
          - missingkey=error
        inline:
          template: |
            {{- $xr := .observed.composite.resource -}}
            {{- $spec := $xr.spec -}}
            {{- if ne $xr.metadata.namespace "capmox-system" -}}
            {{- fail "TenantCluster must be created in capmox-system" -}}
            {{- end -}}
            {{- $cluster := getComposedResource . "cluster" -}}
            {{- $ready := false -}}
            {{- $progress := list -}}
            {{- $stages := list
              (dict "name" "control-plane" "conditionType" "ControlPlaneReady" "sourceCondition" "ControlPlaneAvailable")
              (dict "name" "workers" "conditionType" "WorkersReady" "sourceCondition" "WorkersAvailable")
              (dict "name" "cluster-health" "conditionType" "ClusterAvailable" "sourceCondition" "Available") -}}
            {{- range $stage := $stages -}}
              {{- $state := "Pending" -}}
              {{- $conditionStatus := "Unknown" -}}
              {{- $reason := "WaitingForCluster" -}}
              {{- $message := "Waiting for the CAPI Cluster to be observed" -}}
              {{- if $cluster -}}
                {{- $reason = "WaitingForCondition" -}}
                {{- $message = printf "Waiting for CAPI to report %s" $stage.sourceCondition -}}
                {{- $status := get $cluster "status" | default dict -}}
                {{- range (get $status "conditions" | default list) -}}
                  {{- if eq .type $stage.sourceCondition -}}
                    {{- $conditionStatus = .status -}}
                    {{- $reason = get . "reason" | default "ConditionReported" -}}
                    {{- $message = get . "message" | default (printf "CAPI reports %s=%s" .type .status) -}}
                    {{- if eq .status "True" -}}
                      {{- $state = "Ready" -}}
                    {{- else if eq .status "False" -}}
                      {{- $state = "Reconciling" -}}
                    {{- else -}}
                      {{- $state = "Unknown" -}}
                    {{- end -}}
                  {{- end -}}
                {{- end -}}
                {{- if get $cluster.metadata "deletionTimestamp" -}}
                  {{- $state = "Deleting" -}}
                  {{- $conditionStatus = "False" -}}
                  {{- $reason = "Deleting" -}}
                  {{- $message = "The CAPI Cluster is being deleted" -}}
                {{- end -}}
              {{- end -}}
              {{- if eq $stage.sourceCondition "Available" -}}
                {{- $ready = eq $conditionStatus "True" -}}
              {{- end -}}
              {{- $progress = append $progress (merge (dict
                "state" $state "status" $conditionStatus
                "reason" $reason "message" $message) $stage) -}}
            {{- end }}
            apiVersion: cluster.x-k8s.io/v1beta2
            kind: Cluster
            metadata:
              name: {{ $xr.metadata.name | quote }}
              namespace: {{ $xr.metadata.namespace | quote }}
              annotations:
                gotemplating.fn.crossplane.io/composition-resource-name: cluster
                gotemplating.fn.crossplane.io/ready: {{ ternary "True" "False" $ready | quote }}
              labels:
                platform.sbrtech.xyz/networking: managed-cilium
            spec:
              clusterNetwork:
                pods:
                  cidrBlocks:
                    - {{ $spec.podCIDR | quote }}
                services:
                  cidrBlocks:
                    - {{ $spec.serviceCIDR | quote }}
                serviceDomain: cluster.local
              topology:
                classRef:
                  name: kamaji-proxmox-v1
                version: {{ $spec.kubernetesVersion | quote }}
                controlPlane:
                  replicas: {{ $spec.controlPlaneReplicas }}
                workers:
                  machineDeployments:
                    - class: standard-worker
                      name: workers
                      replicas: {{ $spec.workerReplicas }}
                variables:
                  - name: managementIPv4Config
                    value:
            {{ $spec.managementIPv4Config | toYaml | indent 12 }}
                  - name: apiDomain
                    value: {{ $spec.apiDomain | quote }}
            ---
            apiVersion: platform.sbrtech.xyz/v1alpha1
            kind: TenantCluster
            metadata:
              annotations:
                gotemplating.fn.crossplane.io/ready: {{ ternary "True" "False" $ready | quote }}
            status:
              steps:
            {{- range $stage := $progress }}
                - name: {{ $stage.name | quote }}
                  state: {{ $stage.state | quote }}
                  sourceCondition: {{ $stage.sourceCondition | quote }}
                  reason: {{ $stage.reason | quote }}
                  message: {{ $stage.message | quote }}
            {{- end }}
              clusterRef:
                apiVersion: cluster.x-k8s.io/v1beta2
                kind: Cluster
                name: {{ $xr.metadata.name | quote }}
                namespace: {{ $xr.metadata.namespace | quote }}
            {{- if $cluster }}
              {{- $clusterSpec := get $cluster "spec" | default dict }}
              {{- with (get $clusterSpec "controlPlaneEndpoint") }}
              controlPlaneEndpoint:
            {{ . | toYaml | indent 4 }}
              {{- end }}
            {{- end }}
            ---
            apiVersion: meta.gotemplating.fn.crossplane.io/v1alpha1
            kind: ClaimConditions
            conditions:
            {{- range $stage := $progress }}
              - type: {{ $stage.conditionType | quote }}
                status: {{ $stage.status | quote }}
                reason: {{ $stage.reason | quote }}
                message: {{ $stage.message | quote }}
                target: Composite
            {{- end }}
