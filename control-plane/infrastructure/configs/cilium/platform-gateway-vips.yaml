apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: platform-gateway-vips
spec:
  allowFirstLastIPs: "Yes"
  blocks:
    - cidr: 10.80.32.0/26
  serviceSelector:
    matchExpressions:
      - key: io.kubernetes.service.namespace
        operator: In
        values:
          - platform-networking
      - key: gateway.networking.k8s.io/gateway-name
        operator: In
        values:
          - internal
          - public
