apiVersion: cilium.io/v2
kind: CiliumBGPAdvertisement
metadata:
  name: platform-gateway-vips
  labels:
    advertise: bgp
spec:
  advertisements:
    - advertisementType: Service
      service:
        addresses:
          - LoadBalancerIP
      selector:
        matchExpressions:
          - key: io.kubernetes.service.namespace
            operator: In
            values:
              - platform-networking
          - key: gateway.networking.k8s.io/gateway-name
            operator: In
            values:
              - internal
              - public
