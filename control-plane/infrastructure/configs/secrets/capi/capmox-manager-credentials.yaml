apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: capmox-manager-credentials
  namespace: capmox-system
spec:
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-control-plane

  target:
    name: capmox-manager-credentials
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: token
      remoteRef:
        key: capi-proxmox-credentials
        property: token

    - secretKey: secret
      remoteRef:
        key: capi-proxmox-credentials
        property: password

    - secretKey: url
      remoteRef:
        key: capi-proxmox-credentials
        property: proxmox_endpoint
