apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: projectsveltos
  namespace: projectsveltos
spec:
  interval: 30m
  timeout: 10m
  releaseName: projectsveltos
  targetNamespace: projectsveltos
  chart:
    spec:
      chart: projectsveltos
      version: "1.16.0"
      sourceRef:
        kind: HelmRepository
        name: projectsveltos
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    # Preserve the chart's CRD upgrade Job; no separate CRD chart or override.
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    agent:
      # Standard Mode 1: agents run in their respective managed clusters.
      managementCluster: false
