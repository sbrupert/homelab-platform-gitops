apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 30m
  timeout: 15m
  releaseName: cilium
  targetNamespace: kube-system
  chartRef:
    kind: OCIRepository
    name: cilium

  # The initial Cilium resources were installed by Talos bootstrap manifests.
  # Explicitly allow Helm to adopt those resources during the first reconcile.
  install:
    disableTakeOwnership: false
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    disableTakeOwnership: false
    strategy:
      name: RetryOnFailure
      retryInterval: 5m

  driftDetection:
    mode: enabled

  values:
    ipam:
      mode: kubernetes

    kubeProxyReplacement: true
    k8sServiceHost: localhost
    k8sServicePort: 7445

    gatewayAPI:
      enabled: true

    bgpControlPlane:
      enabled: true

    hubble:
      enabled: true

    # Preserve Cilium's upgrade compatibility behavior for the existing
    # bootstrap-installed 1.19.x datapath during the first Helm adoption.
    upgradeCompatibility: "1.19"
