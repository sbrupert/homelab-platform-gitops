apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kamaji
  namespace: kamaji-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: kamaji
  targetNamespace: kamaji-system
  chart:
    spec:
      # Keep the chart and CRDs aligned with the controller edge release.
      chart: ./charts/kamaji
      sourceRef:
        kind: GitRepository
        name: kamaji
        namespace: kamaji-system
  driftDetection:
    mode: enabled
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: kamaji
            patch: |-
              - op: replace
                path: /spec/template/spec/containers/0/image
                value: clastix/kamaji@sha256:86ca4488e00dcac850ee23a64f878bc1988f47092ab0c5fc8763c1cff1003880
  values:
    # Kamaji 26.8.2-edge; the post-renderer above pins the matching
    # multi-architecture Docker Hub OCI index digest.
    kamaji-etcd:
      deploy: true
      persistentVolumeClaim:
        storageClassName: fast-block
    image:
      repository: clastix/kamaji
      tag: 26.8.2-edge
      pullPolicy: IfNotPresent
