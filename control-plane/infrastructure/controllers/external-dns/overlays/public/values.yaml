apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  releaseName: external-dns-public

  values:
    provider:
      name: cloudflare

    sources:
      - gateway-httproute

    domainFilters:
      - sbrtech.xyz

    txtOwnerId: homelab-control-plane-public

    env:
      - name: CF_API_TOKEN
        valueFrom:
          secretKeyRef:
            name: external-dns-cloudflare
            key: api-token

    extraArgs:
      gateway-label-filter: gateway.sbrtech.xyz/exposure=public
      cloudflare-proxied: "false"
