apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  releaseName: external-dns-internal

  values:
    provider:
      name: rfc2136

    sources:
      - gateway-httproute
      - service

    domainFilters:
      - sbrtech.xyz

    txtOwnerId: homelab-control-plane

    env:
      - name: EXTERNAL_DNS_RFC2136_TSIG_SECRET
        valueFrom:
          secretKeyRef:
            name: external-dns-rfc2136
            key: tsig-secret

    extraArgs:
      gateway-label-filter: gateway.sbrtech.xyz/exposure=internal
      rfc2136-host: 10.1.10.5
      rfc2136-port: 53
      rfc2136-zone:
        - svc.int.sbrtech.xyz
        - sbrtech.xyz
      rfc2136-tsig-keyname: external-dns-control-plane
      rfc2136-tsig-secret-alg: hmac-sha256
      rfc2136-tsig-axfr:
      rfc2136-min-ttl: 60s
      service-type-filter:
        - LoadBalancer
