apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: external-dns
  namespace: external-dns
spec:
  interval: 30m
  timeout: 10m
  releaseName: external-dns
  targetNamespace: external-dns

  chart:
    spec:
      chart: external-dns
      version: "1.21.1"
      interval: 1h
      sourceRef:
        kind: HelmRepository
        name: external-dns
        namespace: external-dns

  driftDetection:
    mode: enabled

  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m

  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m

  values:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 256Mi

    policy: sync
    registry: txt
    txtPrefix: external-dns-

    interval: 1m
    triggerLoopOnEvent: true

    logLevel: info
    logFormat: json
