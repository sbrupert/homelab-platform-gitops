# tests/truenas-csi/patches/talos-iscsiadm-path.yaml
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: truenas-csi-node
  namespace: truenas-csi
spec:
  template:
    spec:
      containers:
        - name: csi-node
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - >-
                    mkdir -p /run/lock/iscsi &&
                    mv /usr/sbin/iscsiadm /usr/sbin/iscsiadm.orig 2>/dev/null;
                    printf '#!/bin/sh\nnsenter --mount=/host/proc/1/ns/mnt -- /usr/local/sbin/iscsiadm "$@"\n'
                    > /usr/sbin/iscsiadm &&
                    chmod +x /usr/sbin/iscsiadm;
                    nsenter --mount=/host/proc/1/ns/mnt -- modprobe nvme_tcp 2>/dev/null || true;
                    nsenter --mount=/host/proc/1/ns/mnt -- modprobe nvme_fabrics 2>/dev/null || true;
                    test -x /usr/sbin/iscsiadm