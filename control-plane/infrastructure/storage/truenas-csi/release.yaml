apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: truenas-csi
  namespace: truenas-csi
spec:
  interval: 30m
  timeout: 10m
  releaseName: truenas-csi
  targetNamespace: truenas-csi
  chart:
    spec:
      chart: truenas-csi
      version: 1.3.0
      sourceRef:
        kind: HelmRepository
        name: truenas-csi
        namespace: truenas-csi
  driftDetection:
    mode: enabled
  install:
    disableTakeOwnership: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    disableTakeOwnership: true
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    fullnameOverride: truenas-csi
    driverName: csi.truenas.io
    kubeletDir: /var/lib/kubelet

    namespace:
      create: false

    truenas:
      url: wss://prodigy.infra.int.sbrtech.xyz/api/current
      defaultPool: ssd-pool
      nfsServer: 10.0.5.4
      iscsiPortal: 10.0.5.4:3260
      nvmeofPortal: 10.0.5.4:4420
      iscsiIQNBase: iqn.2005-10.org.freenas.ctl
      insecureSkipTLS: false
      existingSecret: truenas-api-credentials
      existingSecretKey: api-key

    controller:
      replicas: 1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule

    storageClasses: []
    volumeSnapshotClass:
      enabled: false
