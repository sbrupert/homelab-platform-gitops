apiVersion: operator.cluster.x-k8s.io/v1alpha2
kind: InfrastructureProvider
metadata:
  name: proxmox
  namespace: capmox-system
spec:
  version: v0.9.1
  fetchConfig:
    url: https://github.com/ionos-cloud/cluster-api-provider-proxmox/releases/download/v0.9.1/infrastructure-components.yaml
  # CAPMOX v0.9.1 exposes secure metrics on :8443, but its upstream Service
  # targets an undeclared named port. Match the upstream workaround until a
  # fixed CAPMOX release is available.
  patches:
    - target:
        group: apps
        version: v1
        kind: Deployment
        name: capmox-controller-manager
        namespace: capmox-system
      patch: |-
        - op: add
          path: /spec/template/spec/containers/0/ports/-
          value:
            containerPort: 8443
            name: metrics
            protocol: TCP
    - target:
        version: v1
        kind: Service
        name: capmox-controller-manager-metrics-service
        namespace: capmox-system
      patch: |-
        - op: replace
          path: /spec/ports/0/targetPort
          value: metrics
