apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capi-operator
  namespace: capi-operator-system
spec:
  interval: 30m
  timeout: 10m
  releaseName: capi-operator
  targetNamespace: capi-operator-system
  chart:
    spec:
      chart: cluster-api-operator
      version: 0.29.0
      sourceRef:
        kind: HelmRepository
        name: capi-operator
  driftDetection:
    mode: enabled
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
