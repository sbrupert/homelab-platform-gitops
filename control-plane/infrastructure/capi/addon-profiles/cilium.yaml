---
# One HelmChartProxy manages the platform-owned Cilium release for every
# matching tenant Cluster in this namespace. Do not create another proxy with
# the same selector and release name for each tenant.
apiVersion: addons.cluster.x-k8s.io/v1alpha1
kind: HelmChartProxy
metadata:
  name: platform-cilium
  namespace: capmox-system
spec:
  clusterSelector:
    matchLabels:
      platform.sbrtech.xyz/networking: managed-cilium
  repoURL: oci://quay.io/cilium/charts
  chartName: cilium
  version: "1.20.2"
  releaseName: platform-cilium
  namespace: kube-system
  reconcileStrategy: Continuous
  options:
    wait: false
    timeout: 10m
    install:
      createNamespace: false
  valuesTemplate: |
    ipam:
      mode: kubernetes
    kubeProxyReplacement: true
    k8sServiceHost: "{{ .Cluster.spec.controlPlaneEndpoint.host }}"
    k8sServicePort: 6443
    operator:
      replicas: 1
    hubble:
      enabled: false
    gatewayAPI:
      enabled: true
    bgpControlPlane:
      enabled: true