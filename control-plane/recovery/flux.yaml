apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-controllers
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./control-plane/infrastructure/controllers/external-secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: infrastructure-external-secrets-configs
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-controllers
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./control-plane/infrastructure/configs/external-secrets
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: recovery-garage-credentials
  namespace: flux-system
spec:
  dependsOn:
    - name: infrastructure-external-secrets-configs
  interval: 10m
  retryInterval: 1m
  timeout: 5m
  path: ./control-plane/recovery/garage-credentials
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: recovery-velero
  namespace: flux-system
spec:
  dependsOn:
    - name: recovery-garage-credentials
  interval: 10m
  retryInterval: 1m
  timeout: 15m
  path: ./control-plane/recovery/velero
  prune: true
  deletionPolicy: Orphan
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
