apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: crossplane-core
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 10m
  path: ./control-plane/crossplane/core
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
